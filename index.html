<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Informe de Novedades</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body class="container py-4">

<h3>Informe de Novedades – Laboratorio / Taller</h3>

<form id="formInforme">

  <div class="mb-2">
    <label>Nombre Docente *</label>
    <input id="docente" class="form-control" required>
  </div>

  <div class="mb-2">
    <label>Asignatura / Laboratorio *</label>
    <input id="asignatura" class="form-control" required>
  </div>

  <div class="row">
    <div class="col-md-4 mb-2">
      <label>Fecha *</label>
      <input type="date" id="fecha" class="form-control" required>
    </div>
    <div class="col-md-4 mb-2">
      <label>Horario</label>
      <input id="horario" class="form-control">
    </div>
    <div class="col-md-4 mb-2">
      <label>Laboratorio N°</label>
      <input id="lab" class="form-control">
    </div>
  </div>

  <div class="mb-3">
    <label>Descripción o Sugerencia *</label>
    <textarea id="descripcion" class="form-control" rows="4" required></textarea>
  </div>

  <label>Firma Docente *</label>
  <canvas id="firma" width="300" height="150"></canvas>
  <button type="button" class="btn btn-sm btn-secondary mt-1" onclick="limpiarFirma()">Limpiar firma</button>

  <div class="mt-3">
    <label>Correo destinatario *</label>
    <input type="email" id="correo" class="form-control" required>
  </div>

  <button class="btn btn-primary mt-3" type="submit">
    Generar PDF y enviar correo
  </button>

</form>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="firma.js"></script>
<script src="app.js"></script>

</body>
</html>
