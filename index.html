<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Informe de Novedades</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="container py-4">

<h4 class="mb-3 text-center">INFORME DE NOVEDADES</h4>

<form id="formInforme">

  <div class="mb-2">
    <label>Nombre Docente *</label>
    <input id="docente" class="form-control" required>
  </div>

  <div class="mb-2">
    <label>Nombre Asignatura *</label>
    <input id="asignatura" class="form-control" required>
  </div>

  <div class="row">
    <div class="col-md-4 mb-2">
      <label>Fecha *</label>
      <input type="date" id="fecha" class="form-control" required>
    </div>

    <div class="col-md-4 mb-2">
      <label>Horario Inicio *</label>
      <select id="horario" size="5" class="form-select" required>
        <option value="">Seleccione…</option>
        <option>8:30</option>
        <option>9:15</option>
        <option>10:10</option>
        <option>10:55</option>
        <option>11:40</option>
        <option>12:25</option>
        <option>13:10</option>
        <option>13:55</option>
        <option>14:40</option>
        <option>15:25</option>
        <option>16:15</option>
        <option>17:00</option>
        <option>17:45</option>
        <option>18:30</option>
        <option>19:50</option>
        <option>20:30</option>
        <option>21:10</option>
        <option>21:50</option>
      </select>
    </div>

    <div class="col-md-4 mb-2">
      <label>Laboratorio *</label>
      <select size="5" id="laboratorio" class="form-select" required>
        <option value="">Seleccione…</option>
        <option>LTEL</option>
        <option>LINF</option>
        <option>LEICA</option>
        <option>LEICA 2</option>
        <option>LNET</option>
        <option>C2</option>
        <option>C8</option>
        <option>C6</option>
        <option>ALCR</option>
        <option>ALCS</option>
        <option>ALPLC</option>
        <option>ALEP</option>
        <option>ALCP</option>
        <option>ALEE</option>
        <option>ALCE</option>
        <option>A405</option>
        <option>A406</option>
        <option>MAC1</option>
        <option>MAC2</option>
        <option>TD1</option>
        <option>TD2</option>
      </select>
    </div>
  </div>

  <hr>

  <label class="fw-bold">Problema(s) detectado(s)</label>

  <div class="form-check mt-2">
    <input class="form-check-input problema" type="checkbox" data-id="equipos">
    <label class="form-check-label">Falla de Equipos / Instrumentos / Software</label>
    <textarea class="form-control mt-1 d-none" id="obs-equipos" placeholder="Ingrese el problema detectado"></textarea>
  </div>

  <div class="form-check mt-2">
    <input class="form-check-input problema" type="checkbox" data-id="equipamiento">
    <label class="form-check-label">Falta Equipamiento</label>
    <textarea class="form-control mt-1 d-none" id="obs-equipamiento" placeholder="Ingrese el problema detectado"></textarea>
  </div>

  <div class="form-check mt-2">
    <input class="form-check-input problema" type="checkbox" data-id="insumos">
    <label class="form-check-label">Falta de Insumos</label>
    <textarea class="form-control mt-1 d-none" id="obs-insumos" placeholder="Ingrese el problema detectado"></textarea>
  </div>

  <div class="form-check mt-2">
    <input class="form-check-input problema" type="checkbox" data-id="otros">
    <label class="form-check-label">Otros</label>
    <textarea class="form-control mt-1 d-none" id="obs-otros" placeholder="Ingrese el problema detectado"></textarea>
  </div>

  <div class="mt-3">
    <label class="fw-bold">Descripción General </label>
    <textarea id="descripcion" class="form-control" rows="4"></textarea>
  </div>

  <hr>

  <label class="fw-bold">Firma Docente *</label>
  <canvas id="firma" width="300" height="150"></canvas>
  <button type="button" class="btn btn-sm btn-secondary mt-1" onclick="limpiarFirma()">Limpiar firma</button>

  <div class="mt-3">
    <label>Correo destinatario *</label>
    <input type="email" id="correo" class="form-control" value="jcueto@inacap.cl" required>
  </div>

  <button class="btn btn-primary mt-4 w-100" type="submit">
    Enviar Informe
  </button>
<span id="mensajeCarga" style="display: none; margin-left: 10px; color: blue;">Enviando informe, por favor espere...</span>
</form>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="js/firma.js"></script>
<script src="js/app.js"></script>

</body>
</html>
